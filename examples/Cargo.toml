[package]
name = "clap-mcp-examples"
version = "0.1.0"
edition = "2024"
publish = false
description = "Examples for clap-mcp"

[dependencies]
clap-mcp = { path = "../clap-mcp", features = ["tracing", "log", "derive"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { workspace = true }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt", "env-filter"] }
log = "0.4"

[[bin]]
name = "subcommands"
path = "servers/subcommands.rs"

[[bin]]
name = "structured"
path = "servers/structured.rs"

[[bin]]
name = "tracing_bridge"
path = "servers/tracing_bridge.rs"
required-features = ["tracing"]

[[bin]]
name = "log_bridge"
path = "servers/log_bridge.rs"
required-features = ["log"]

[[bin]]
name = "async_sleep"
path = "servers/async_sleep.rs"
required-features = ["tracing"]

[[bin]]
name = "async_sleep_shared"
path = "servers/async_sleep_shared.rs"
required-features = ["tracing"]

[[bin]]
name = "async_embedder_serve"
path = "servers/async_embedder_serve.rs"
required-features = ["tracing"]

[[bin]]
name = "struct_subcommand"
path = "servers/struct_subcommand.rs"

[[bin]]
name = "struct_subcommand_required"
path = "servers/struct_subcommand_required.rs"

[[bin]]
name = "struct_subcommand_globals"
path = "servers/struct_subcommand_globals.rs"

[[bin]]
name = "passthrough_args"
path = "servers/passthrough_args.rs"

[[bin]]
name = "passthrough_args_subprocess"
path = "servers/passthrough_args_subprocess.rs"

[[bin]]
name = "custom_mcp_flags"
path = "servers/custom_mcp_flags.rs"

[[bin]]
name = "optional_commands_and_args"
path = "servers/optional_commands_and_args.rs"

[[bin]]
name = "result_output"
path = "servers/result_output.rs"

[[bin]]
name = "subprocess_exit_handling"
path = "servers/subprocess_exit_handling.rs"

[[bin]]
name = "panic_catch_opt_in"
path = "servers/panic_catch_opt_in.rs"

[[bin]]
name = "custom_resources_prompts"
path = "servers/custom_resources_prompts.rs"

[[bin]]
name = "vec_and_flags"
path = "servers/vec_and_flags.rs"

[[bin]]
name = "arg_group_hints"
path = "servers/arg_group_hints.rs"

[[bin]]
name = "preserve_cli_parse"
path = "servers/preserve_cli_parse.rs"

[[bin]]
name = "flat_struct_root"
path = "servers/flat_struct_root.rs"

[[bin]]
name = "flatten_skip"
path = "servers/flatten_skip.rs"

[[bin]]
name = "flatten_subcommand_skip_flat"
path = "servers/flatten_subcommand_skip_flat.rs"

[[bin]]
name = "flatten_subcommand_skip_nested"
path = "servers/flatten_subcommand_skip_nested.rs"

[[bin]]
name = "capture_stdout"
path = "servers/capture_stdout.rs"

[[bin]]
name = "nested_subcommands"
path = "servers/nested_subcommands.rs"

[[bin]]
name = "stateful_counter"
path = "servers/stateful_counter.rs"

[[bin]]
name = "placeholder_server"
path = "servers/placeholder_server.rs"

[[bin]]
name = "invalid_executable_server"
path = "servers/invalid_executable_server.rs"

[[bin]]
name = "stderr_success"
path = "servers/stderr_success.rs"

[[bin]]
name = "client"
