name: MCP conformance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Start MCP HTTP conformance server
        run: |
          mkdir -p target
          cargo xtask conformance-server --log-file target/conformance-server.log &
          timeout 60 bash -c 'until test -f target/conformance-port; do sleep 0.25; done'
          set -a && source target/conformance-port && set +a
          echo "CONFORMANCE_PORT=$CONFORMANCE_PORT" >> "$GITHUB_ENV"

      - name: Run MCP conformance (official Action)
        id: conformance
        uses: modelcontextprotocol/conformance@v0.1.11
        with:
          mode: server
          url: http://127.0.0.1:${{ env.CONFORMANCE_PORT }}/mcp
          suite: active
          expected-failures: ./conformance-baseline.yml
          verbose: true

      - name: Upload conformance debug bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-debug-${{ github.run_id }}
          path: |
            target/conformance-server.log
            target/conformance-port
            conformance-baseline.yml
          retention-days: 14
