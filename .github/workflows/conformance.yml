name: MCP conformance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  conformance:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: ci-conformance

      - name: Restore conformance gate state
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        id: gate-cache
        with:
          path: ${{ runner.temp }}/conformance-gate
          key: conformance-gate-${{ github.repository }}-${{ github.ref_name }}

      - name: Gate scheduled runs
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FINGERPRINT=$(
            {
              sha256sum .github/workflows/conformance.yml
              sha256sum docker/conformance/VERSION
              sha256sum docker/conformance/Dockerfile
              sha256sum conformance-profiles/conformance-2025-11-25.yml
              sha256sum conformance-profiles/conformance-draft-2026-07-28.yml
              sha256sum xtask/src/conformance.rs
            } | sha256sum | awk '{print $1}'
          )
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: always execute conformance."
            exit 0
          fi

          LAST_FP=""
          if [ -f "$RUNNER_TEMP/conformance-gate/state.env" ]; then
            # shellcheck disable=SC1091
            source "$RUNNER_TEMP/conformance-gate/state.env"
          fi

          echo "Looking up last successful conformance run..."
          LAST_SHA=$(gh run list \
            --workflow=conformance.yml \
            --branch="${{ github.ref_name }}" \
            --status=success \
            --limit=1 \
            --json headSha \
            --jq '.[0].headSha // empty')

          REASON=""
          if [ -z "$LAST_SHA" ] || [ "$LAST_SHA" != "${{ github.sha }}" ]; then
            REASON="repo changed since last successful run (last=${LAST_SHA:-none}, head=${{ github.sha }})"
          elif [ "${{ steps.gate-cache.outputs.cache-hit }}" != "true" ] || [ "$LAST_FP" != "$FINGERPRINT" ]; then
            REASON="harness fingerprint changed (stored=${LAST_FP:-none}, current=$FINGERPRINT)"
          fi

          if [ -n "$REASON" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled run will execute: $REASON"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scheduled conformance: no commits since last success and harness unchanged."
          fi

      - name: Run MCP conformance (2025-11-25 + draft)
        if: steps.gate.outputs.run == 'true'
        id: conformance
        # Local/CI parity via cargo xtask (Docker image from docker/conformance/VERSION).
        run: cargo xtask conformance --verbose

      - name: Write conformance gate state
        if: success() && steps.gate.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/conformance-gate"
          {
            echo "LAST_SHA=${{ github.sha }}"
            echo "LAST_FP=${{ steps.gate.outputs.fingerprint }}"
          } > "$RUNNER_TEMP/conformance-gate/state.env"

      - name: Save conformance gate state
        if: success() && steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/conformance-gate
          key: conformance-gate-${{ github.repository }}-${{ github.ref_name }}

      - name: Upload conformance debug bundle
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: conformance-debug-${{ github.run_id }}
          path: |
            target/conformance-server.log
            target/conformance-port
            conformance-profiles/conformance-2025-11-25.yml
            conformance-profiles/conformance-draft-2026-07-28.yml
          retention-days: 14
