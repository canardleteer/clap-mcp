name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}-all-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests (all features)
        run: cargo test --all-features

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Security audit
        if: matrix.os == 'ubuntu-latest'
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run examples (release validation)
        run: cargo xtask examples-help

      - name: Check rustdoc (no warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps -p clap-mcp --all-features

  conformance:
    name: MCP conformance (ubuntu)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-conformance

      - name: Start MCP HTTP conformance server
        run: |
          mkdir -p target
          cargo xtask conformance-server --log-file target/conformance-server.log &
          timeout 60 bash -c 'until test -f target/conformance-port; do sleep 0.25; done'
          set -a && source target/conformance-port && set +a
          echo "CONFORMANCE_PORT=$CONFORMANCE_PORT" >> "$GITHUB_ENV"

      - name: Run MCP conformance (official Action)
        uses: modelcontextprotocol/conformance@v0.1.11
        with:
          mode: server
          url: http://127.0.0.1:${{ env.CONFORMANCE_PORT }}/mcp
          suite: active
          expected-failures: ./conformance-baseline.yml
          verbose: true
