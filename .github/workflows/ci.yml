name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: ci-${{ matrix.os }}-all-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check rustdoc (no warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps -p clap-mcp --all-features

      - name: Lint Markdown
        if: matrix.os == 'ubuntu-latest'
        uses: rvben/rumdl@v0

      - name: Security audit
        if: matrix.os == 'ubuntu-latest'
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests (all features)
        timeout-minutes: 25
        run: cargo test --all-features

      - name: Build and run examples (release validation)
        run: cargo xtask examples-help

  conformance:
    name: MCP conformance (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: ci-conformance

      - name: Run MCP conformance (2025-11-25 + draft)
        # Local/CI parity: Docker image from docker/conformance/VERSION; xtask runs
        # active@2025-11-25 then draft@draft with separate baselines.
        run: cargo xtask conformance --verbose
