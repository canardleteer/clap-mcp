[workspace]
resolver = "3"
members = ["clap-mcp", "clap-mcp/macros", "examples"]

[workspace.package]
version = "0.0.3-rc.1"

[workspace.dependencies]
clap-mcp-macros = { path = "clap-mcp/macros", version = "0.0.3-rc.1" }
rust-mcp-sdk = { version = "0.9.0", default-features = false, features = ["server", "client", "stdio"] }
